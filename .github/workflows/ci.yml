name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    # CODEBASE_ISSUES H1: previously `next build` was the only thing that
    # caught type errors in src/, and the build job runs after lint+tests
    # so type errors only surfaced ~5 minutes into a CI run. This job is
    # ~30s and gives faster, narrower feedback.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run type-check

  test-components:
    name: Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx jest --config jest.config.js --ci --coverage

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx jest --config jest.config.api.js --ci --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-components, test-api]
    # Day 3 wired src/instrumentation.ts → src/lib/env.ts so env validation
    # runs at build time. The values below match jest.env.setup.js so the
    # build doesn't reach for a real database, S3, or SMTP server.
    env:
      MONGODB_URI: mongodb://localhost:27017/carsales-build
      SESSION_SECRET: ci-build-session-secret-at-least-32-characters-long
      ADMIN_PASSWORD: ci-build-admin-password
      EMAIL_FROM: ci@example.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BUSINESS_NAME: Morley Motor Company
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_BUSINESS_NAME: Morley Motor Company
      NEXT_BUSINESS_PHONE: 555-123-4567
      NEXT_BUSINESS_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    env:
      MONGODB_URI: mongodb://localhost:27017/carsales-e2e
      SESSION_SECRET: ci-e2e-session-secret-at-least-32-characters-long
      ADMIN_PASSWORD: ci-e2e-admin-password
      EMAIL_FROM: e2e@example.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BUSINESS_NAME: Morley Motor Company
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_BUSINESS_NAME: Morley Motor Company
      NEXT_BUSINESS_PHONE: 555-123-4567
      NEXT_BUSINESS_EMAIL: e2e@example.com
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Build with the same env, then start in the background and wait for the
      # port. We run the production build (not `next dev`) so CI reflects what
      # ships. The PID is captured so we can stop the server cleanly afterwards.
      - run: npm run build
      - name: Start Next server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          # Wait up to 60s for the port to come up. No `wait-on` dep required.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 60s"; tail -n 200 server.log; exit 1

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Stop Next server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
          if [ -f server.log ]; then echo "── server.log tail ──"; tail -n 100 server.log; fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
