name: Auto-Approve Dependency PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  auto-approve:
    name: Auto-approve dependency update PR
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      github.event.pull_request.user.login == 'copilot[bot]'

    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve --body "✅ Auto-approved — dependency update PR from Copilot agent."
